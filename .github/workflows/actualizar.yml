name: Actualizar FWI

on:
  schedule:
    # Todas las horas son UTC. El dato del FWI es el del mediodía solar, que son siempre las 12:00 UTC
    # (13:00 en invierno, 14:00 en verano). Se espera a que Euskalmet lo publique hasta 60 minutos después;
    # a esa hora (15:00 en verano, 14:00 en invierno) el día se cierra siempre con el dato de las 12:00 UTC.
    - cron: "0 6 * * *"      # previsión de primera hora (08:00 en verano, 07:00 en invierno)
    - cron: "20 12 * * *"    # dato del día: 14:20 en verano / 13:20 en invierno
    - cron: "40 12 * * *"    # reintento: 14:40 / 13:40
    - cron: "0 13 * * *"     # cierre del día: 15:00 / 14:00 (lo que falte se completa con la regla)
    - cron: "20 13 * * *"    # respaldo por si GitHub retrasa o falla la ejecución de cierre
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write      # para guardar los datos nuevos en el repositorio

concurrency:
  group: fwi
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pyjwt cryptography requests

      - name: Descargar datos y calcular el FWI
        env:
          EUSKALMET_KEY: ${{ secrets.EUSKALMET_KEY }}
          EUSKALMET_EMAIL: ${{ secrets.EUSKALMET_EMAIL }}
        run: |
          umask 077
          printf '%s\n' "$EUSKALMET_KEY" > "$RUNNER_TEMP/clave.pem"
          python actualizar_fwi.py --clave "$RUNNER_TEMP/clave.pem"
          rm -f "$RUNNER_TEMP/clave.pem"

      - name: Guardar los cambios
        run: |
          git config user.name "fwi-bot"
          git config user.email "fwi-bot@users.noreply.github.com"
          git add datos docs/data
          git diff --staged --quiet && exit 0
          git commit -m "Actualiza datos FWI $(date -u +%F)"
          # si GitHub da un error puntual al subir, se reintenta hasta 3 veces
          for intento in 1 2 3; do
            git push && exit 0
            echo "Fallo al subir (intento $intento); se reintenta en 20 s..."
            sleep 20
            git pull --rebase || true
          done
          exit 1
